[project]
name = "clinical-lab-analysis-system"
version = "1.0.0"
description = "MIMIC-III based system for predefined clinical laboratory questions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "streamlit>=1.36",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "playwright>=1.40",
]

# This is an application, not a distributable library: manage dependencies but
# do not try to build/install the project itself.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "conftest.py", ".venv/*"]

[tool.coverage.report]
fail_under = 85
